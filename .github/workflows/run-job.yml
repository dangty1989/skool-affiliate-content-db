name: AI News Bot - Daily Articles

on:
  # Scheduled triggers for automated daily articles
  schedule:
    # Morning article (EU market) - 9 AM UTC = 4 PM Vietnam
    - cron: '0 9 * * *'
    # Evening article (US market) - 1 PM UTC = 8 PM Vietnam
    - cron: '0 13 * * *'
  
  # Allow manual workflow dispatch for testing
  workflow_dispatch:
    inputs:
      job_description:
        description: 'Custom job description (optional)'
        required: false
        type: string

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Determine Job Description
        id: job-info
        run: |
          JOB_ID=$(uuidgen)
          echo "job_id=${JOB_ID}" >> $GITHUB_OUTPUT
          
          if [ "${{ github.event_name }}" == "schedule" ]; then
            if [ "${{ github.event.schedule }}" == "0 9 * * *" ]; then
              DESC="URGENT: Run 'node /job/.pi/scripts/fetch-ai-news.js' immediately to fetch morning news. Then pick the top story and write a 1000-word article for EU audience using the 'write-affiliate-news' skill guidelines. Save to /job/website/content/blog/"
            else
              DESC="URGENT: Run 'node /job/.pi/scripts/fetch-ai-news.js' immediately to fetch evening news. Then pick the top story and write a 1000-word article for US audience using the 'write-affiliate-news' skill guidelines. Save to /job/website/content/blog/"
            fi
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -n "${{ inputs.job_description }}" ]; then
              DESC="${{ inputs.job_description }}"
            else
              DESC="URGENT: Execute the 'write-affiliate-news' skill now. 1) Run 'node /job/.pi/scripts/fetch-ai-news.js'. 2) Read '/job/logs/latest-ai-news.json'. 3) Write a 1000-word blog post about the top story. 4) Save to /job/website/content/blog/YYYY-MM-DD-slug.md"
            fi
          else
            DESC="Process incoming job request"
          fi
          
          echo "description=${DESC}" >> $GITHUB_OUTPUT

      - name: Create Job Branch
        run: |
          JOB_ID="${{ steps.job-info.outputs.job_id }}"
          JOB_BRANCH="job/${JOB_ID}"
          
          echo "📋 Creating job branch: ${JOB_BRANCH}"
          
          # Create and switch to job branch
          git checkout -b "${JOB_BRANCH}"
          
          # Create the job.md file that PopeBot expects
          mkdir -p "logs/${JOB_ID}"
          echo "${{ steps.job-info.outputs.description }}" > "logs/${JOB_ID}/job.md"
          
          # Force add (logs/ may be in .gitignore)
          git add -f "logs/${JOB_ID}/job.md"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Create job ${JOB_ID}"
          git push origin "${JOB_BRANCH}"
          
          echo "✅ Job branch created and pushed"

      - name: Run AI News Bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: "gpt-4o"
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_OWNER: "dangty1989"
          GH_REPO: "skool-affiliate-content-db"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_KEY: ${{ secrets.API_KEY }}
          REPO_URL: "https://${{ secrets.GH_TOKEN }}@github.com/dangty1989/skool-affiliate-content-db.git"
          BRANCH: "job/${{ steps.job-info.outputs.job_id }}"
          JOB_TYPE: "custom"
          JOB_DESCRIPTION: ${{ steps.job-info.outputs.description }}
          DEBUG: "true"
        run: |
          IMAGE="stephengpope/thepopebot:latest"
          
          echo "🤖 Starting AI News Bot"
          echo "📝 Job ID: ${{ steps.job-info.outputs.job_id }}"
          echo "🌿 Branch: job/${{ steps.job-info.outputs.job_id }}"
          echo "🧠 Model: gpt-4o (OpenAI)"
          echo "🎯 Description: ${JOB_DESCRIPTION}"
          echo "🔧 Patching entrypoint: anthropic → openai"
          
          docker run --rm \
            --entrypoint /bin/bash \
            -e REPO_URL="${REPO_URL}" \
            -e BRANCH="${BRANCH}" \
            -e OPENAI_API_KEY="${OPENAI_API_KEY}" \
            -e MODEL="${MODEL}" \
            -e GH_TOKEN="${GH_TOKEN}" \
            -e GH_OWNER="${GH_OWNER}" \
            -e GH_REPO="${GH_REPO}" \
            -e TELEGRAM_BOT_TOKEN="${TELEGRAM_BOT_TOKEN}" \
            -e TELEGRAM_CHAT_ID="${TELEGRAM_CHAT_ID}" \
            -e API_KEY="${API_KEY}" \
            -e JOB_TYPE="${JOB_TYPE}" \
            -e JOB_DESCRIPTION="${JOB_DESCRIPTION}" \
            -e DEBUG="${DEBUG}" \
            "$IMAGE" \
            -c "sed -i 's/--provider anthropic/--provider openai/' /entrypoint.sh && /entrypoint.sh"

      - name: Notify Success
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ AI News Bot completed! Job: ${{ steps.job-info.outputs.job_id }}"

      - name: Notify Failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ AI News Bot failed! Check Actions logs." || true
